name: 🚀 Safe FTP Sync (Additive Only)

on:
  push:
    branches: [ "24.0" ]

jobs:
  ftp-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files (Additive)
        uses: milanmk/actions-file-deployer@master
        with:
          remote-protocol: "ftp"
          remote-host: ${{ secrets.FTP_SERVER }}
          remote-user: ${{ secrets.FTP_USERNAME }}
          remote-password: ${{ secrets.FTP_PASSWORD }}
          remote-path: "/test.radioglas.com/"  # Adjust based on your FTP root
          local-path: ./
          sync: "delta"  # This is the key: only upload changes, never delete
